<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Gerador de Faturas - Modelos</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="app-container">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="brand">Gaffer Invoices</div>
      <nav>
        <ul class="nav-menu">
          <li><a href="/" class="nav-link">Criar Fatura</a></li>
          <li><a href="/templates" class="nav-link active">Modelos de Faturas</a></li>
        </ul>
      </nav>
    </aside>

    <!-- Conteúdo Principal -->
    <main class="main-content">
      <div class="page-header">
        <h1 class="page-title">Modelos de Faturas</h1>
      </div>

      <div class="card">
        <form action="/templates" method="GET" class="form-group" style="margin-bottom: 0;">
          <label for="template_select">Selecione o Modelo</label>
          <select id="template_select" name="template_id" class="form-control" onchange="this.form.submit()">
            <option value="{{ current_template_id }}">{{ current_customer if current_customer else 'Selecione' }}</option>
            {% for template in templates %}
            <option value="{{ template.id }}">{{ template.customer }}</option>
            {% endfor %}
          </select>
        </form>
      </div>

      <div class="card">
        <h2 style="font-size: 1.1rem; margin-bottom: 12px;">Editar Conteúdo do Modelo</h2>
        <form action="/templates/save" method="POST">
          <div class="form-group">
            <label for="template_content">Conteúdo</label>
            <textarea id="template_content" name="template_content" class="form-control" style="font-family: monospace; height: 240px;">{{ template if template else '' }}</textarea>
            <input type="text" name="template_id" value="{{ current_template_id if current_template_id else '' }}" hidden>
          </div>

          <div style="display: flex; gap: 12px;">
            <button type="submit" name="action" value="save" class="btn-primary">Salvar Alterações</button>
          </div>
        </form>
      </div>

    
    {% if template %}
    <div class="card">
        <h2 style="font-size: 1.1rem;">Prévia do Modelo</h2>
        <div class="invoice-preview">
            <div class="invoice-paper">
              {{ template | safe }}
            
            </div>
        </div>
    </div>
    {% endif %}
 
    </main>
  </div>
</body>
</html>
