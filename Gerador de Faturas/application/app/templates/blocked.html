
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acesso Bloqueado</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0f172a;
            color: #e2e8f0;
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        .alert-card {
            width: 100%;
            max-width: 480px;
            padding: 40px 30px;
            text-align: center;
            background: #1e293b;
            border: 1px solid #7f1d1d;
            border-radius: 12px;
            box-shadow: 0 10px 40px #00000040;
        }

        .icon {
            font-size: 64px;
            color: #ef4444;
            margin-bottom: 24px;
        }

        h1 {
            color: #f87171;
            font-size: 26px;
            margin-bottom: 16px;
        }

        p {
            color: #cbd5e1;
            font-size: 15px;
            line-height: 1.7;
            margin-bottom: 20px;
        }

        .status {
            display: inline-block;
            padding: 8px 14px;
            border-radius: 6px;
            background: #450a0a;
            color: #fca5a5;
            font-size: 12px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .footer {
            margin-top: 28px;
            padding-top: 18px;
            border-top: 1px solid #334155;
            color: #64748b;
            font-size: 12px;
        }
    </style>
</head>

<body>
    <main class="alert-card">
        <div class="icon" aria-hidden="true">⛔</div>

        <h1>Acesso Bloqueado</h1>

        <p>
            Uma tentativa de ataque foi detectada!
        </p>

        <p>
            Por motivos de segurança, a solicitação foi
            interrompida. Atividades suspeitas podem ser
            registradas para análise.
        </p>

        <span class="status">AMEAÇA DETECTADA</span>

        <div class="footer">
            Sistema de Segurança · Gerador de Faturas
        </div>
    </main>
</body>
</html>
