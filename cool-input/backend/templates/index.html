<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Cool inputs</title>
<style>
  :root{
    --bg:#0b0c10;
    --panel:#14161c;
    --text:#e6e6f0;
    --muted:#8b8fa3;
    --accent:#7c5cff;
  }
  *{
  box-sizing:border-box
  ;}
  body{
    margin:0;
    min-height:100vh;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  .card{
    width:100%;
    max-width:560px;
    background:var(--panel);
    border:1px solid #22242e;
    border-radius:16px;
    padding:28px;
    box-shadow:0 20px 60px rgba(0,0,0,.4);
  }
  h1{
    font-size:1.3rem;
    margin:0 0 6px;
  }
  p.title{
    color:var(--muted);
    margin:0 0 20px;
    font-size:.9rem;}
  textarea{
    width:100%;
    min-height:90px;
    resize:vertical;
    padding:12px 14px;
    background:#0f1016;
    border:1px solid #2a2d3a;
    border-radius:10px;
    color:var(--text);
    font-size:.95rem;
    font-family:inherit;
  }
  textarea:focus{
    outline:none;
    border-color:var(--accent);
  }
  button{
    margin-top:14px;
    width:100%;
    padding:12px 16px;
    border:none;
    border-radius:10px;
    background:var(--accent);
    color:#fff;
    font-size:.95rem;
    font-weight:600;
    cursor:pointer;
    transition:transform .08s ease, opacity .2s ease;
  }
  button:hover{
    opacity:.9;
  }
  button:active{
    transform:scale(.98);
  }
  #output{
    margin-top:22px;
    min-height:40px;
    padding:16px;
    border-radius:10px;
    background:#0f1016; border:1px dashed #2a2d3a; font-size:1.05rem;
    word-break:break-word;
  }
  .style-label{
    color:var(--muted);
    font-size:.8rem;
    margin-top:10px;
  }
  .result-box{
    font-size:1.4rem;
    font-weight:700;
  }
  @keyframes glitch{
    0%{transform:translate(0,0);} 20%{transform:translate(-1px,1px);}
    40%{transform:translate(1px,-1px);} 60%{transform:translate(-1px,-1px);}
    80%{transform:translate(1px,1px);} 100%{transform:translate(0,0);}
  }
  @keyframes pulse{
    0%,100%{opacity:1;} 50%{opacity:.5;}
  }
</style>

</head>
<body>
  <div class="card">
    <h1>Cool Inputs</h1>
    <p class="title">Digite qualquer coisa para obter um texto em um estilo legal</p>
    <textarea id="text" placeholder="Digite algo..."></textarea>
    <button id="go">Gerar estilo</button>
    <div id="output">Seu texto estilizado aparecerá aqui.</div>
  </div>
<script>
document.getElementById('go').addEventListener('click', async () => {
  const text = document.getElementById('text').value;
  const res = await fetch('/style', {
    method: 'POST',
    headers: {'Content-Type': 'application/x-www-form-urlencoded'},
    body: 'text=' + encodeURIComponent(text)
  });
  const html = await res.text();
  document.getElementById('output').innerHTML = html;
});
</script>
</body>
</html>
