<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DailyNotes - Login Administrativo</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
    <style>
        /* Estilo incorporado ou para o arquivo CSS de suporte ao aviso de erro */
        .alert-error {
            background-color: rgba(255, 77, 77, 0.15);
            border: 1px solid var(--brand-highlight, #FF4D4D);
            color: var(--text-main, #FFFFFF);
            padding: var(--spacing-2, 16px);
            font-size: 14px;
            font-weight: 500;
            margin-bottom: var(--spacing-3, 24px);
            text-align: center;
        }
        .info-box {
            background-color: rgba(104, 255, 77, 0.15);
            border: 1px solid rgb(54, 255, 47);
            color: var(--text-main, #FFFFFF);
            padding: var(--spacing-2, 16px);
            font-size: 14px;
            font-weight: 500;
            margin-top: 20px;
            margin-bottom: var(--spacing-3, 24px);
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="login-wrapper">
        <div class="logo">DailyNotes</div>
        <div class="login-subtitle">Painel Administrativo</div>

        {% if erro %}
        <div class="alert-error" role="alert">
            E-mail ou senha incorretos. Tente novamente.
        </div>
        {% endif %}

        <form action="{{ url_for('login') }}" method="post">
            <div class="input-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" placeholder="email@example.com" required>
            </div>

            <div class="input-group">
                <label for="password">Senha</label>
                <input type="password" id="password" name="password" placeholder="••••••••" required>
            </div>

            <input type="submit" class="btn btn-primary" value="Entrar no Painel">
        </form>

        <div class="info-box">
            Email: admin@dailynote.corp<br>
            Password: senhasecreta123
        </div>

        <a href="#" class="back-link">← Voltar para o site principal</a>
    </div>

</body>
</html>
